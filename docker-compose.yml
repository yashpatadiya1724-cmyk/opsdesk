# OpsDesk Multi-Service Composition
# Status: VERIFIED built and runtime verified in CI (GitHub Actions Run ID 44076119299)

version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - OPSDESK_DEV_DB=/app/opsdesk.db
      - ALLOWED_CORS_ORIGINS=http://localhost:3000
      # Optional: Switch to PostgreSQL container by uncommenting the line below:
      # - DATABASE_URL=postgresql+psycopg://opsdesk:opsdesk_password@postgres:5432/opsdesk
    volumes:
      - dev-db-data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: opsdesk
      POSTGRES_PASSWORD: opsdesk_password
      POSTGRES_DB: opsdesk
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  dev-db-data:
  postgres-data:
