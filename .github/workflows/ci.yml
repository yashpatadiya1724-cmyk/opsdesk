name: OpsDesk Full-Stack CI

on:
  push:
    branches: ["master", "main", "integration/**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest backend/tests -v -m "slow or not slow"

  backend-test-postgres:
    name: Backend Test Suite (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opsdesk
          POSTGRES_PASSWORD: opsdesk_password
          POSTGRES_DB: opsdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify PostgreSQL Alembic Migrations on Empty Database
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://opsdesk:opsdesk_password@localhost:5432/opsdesk
        run: |
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head
          python -m alembic check

      - name: Run Pytest Suite with PostgreSQL
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://opsdesk:opsdesk_password@localhost:5432/opsdesk
          REDIS_URL: redis://localhost:6379/0
        run: |
          python -m pytest backend/tests -v -m "slow or not slow"

      - name: Seed Database and Run PostgreSQL Triage EXPLAIN
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://opsdesk:opsdesk_password@localhost:5432/opsdesk
        run: |
          python -m backend.seed.seed_data --reset --yes
          python scripts/triage_explain.py --pg-only

      - name: Run Scalability Benchmark (100k rows)
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://opsdesk:opsdesk_password@localhost:5432/opsdesk
        run: |
          python scripts/bench_scale.py --tickets 100000 --max-latency-ms 100

  postgres-loadtest-smoke:
    name: PostgreSQL Load Test Smoke (20k tickets, 10s duration)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opsdesk
          POSTGRES_PASSWORD: opsdesk_password
          POSTGRES_DB: opsdesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply Alembic Migrations
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://opsdesk:opsdesk_password@localhost:5432/opsdesk
        run: |
          python -m alembic upgrade head

      - name: Start OpsDesk Backend in Background
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://opsdesk:opsdesk_password@localhost:5432/opsdesk
          REDIS_URL: redis://localhost:6379/0
          APP_ENV: production
          JWT_SECRET_KEY: test_secret_key_ci_smoke_testing_purpose_only_12345
          SCORE_REFRESHER_ENABLED: "false"
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 &
          sleep 4
          curl -f http://127.0.0.1:8000/ready

      - name: Run Load Test Smoke (20k tickets, 10s duration, concurrency 10)
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+psycopg://opsdesk:opsdesk_password@localhost:5432/opsdesk
        run: |
          python scripts/loadtest.py \
            --base-url http://127.0.0.1:8000 \
            --tickets 20000 \
            --duration 10 \
            --concurrency 10 \
            --assert-p95-ms 500 \
            --assert-error-rate 0.01 \
            --json docs/verification/ci_smoke_loadtest.json

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit and component tests
        run: npm test

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Dependency security audit
        # Warn-only if upstream ecosystem vulnerability (e.g. postcss/next.js) exists
        run: |
          npm audit --omit=dev --audit-level=high || echo "::warning::Non-blocking production dependency audit warnings detected"

  frontend-e2e:
    name: Frontend E2E & Accessibility Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install chromium --with-deps

      - name: Run E2E & Accessibility Suite
        working-directory: frontend
        run: npm run test:e2e

      - name: Upload Axe Accessibility Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: axe_report
          path: docs/verification/axe_report.json
          if-no-files-found: warn

  docker:
    name: Container Build & Runtime Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build Docker compose services
        run: docker compose build

      - name: Start Docker compose services
        run: docker compose up -d

      - name: Verify health and readiness endpoints
        run: |
          echo "Waiting for services to become healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q "healthy" && curl -s http://localhost:8000/ready | grep -q "ready"; then
              echo "Services healthy and ready after ${i} attempts"
              break
            fi
            echo "Attempt ${i}/30 failed, sleeping 2s..."
            sleep 2
          done
          echo "Final check for /health:"
          curl -f -v http://localhost:8000/health
          echo "Final check for /ready:"
          curl -f -v http://localhost:8000/ready

      - name: Stop Docker compose services
        if: always()
        run: docker compose down
