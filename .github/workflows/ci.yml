name: OpsDesk Full-Stack CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest backend/tests -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run unit and component tests
        run: npm test

      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Dependency security audit
        # Warn-only if upstream ecosystem vulnerability (e.g. postcss/next.js) exists
        run: |
          npm audit --omit=dev --audit-level=high || echo "::warning::Non-blocking production dependency audit warnings detected"

  docker:
    name: Container Build & Runtime Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker compose services
        run: docker compose build

      - name: Start Docker compose services
        run: docker compose up -d

      - name: Verify health and readiness endpoints
        run: |
          echo "Waiting for services to become healthy..."
          for i in {1..30}; do
            if curl -s http://localhost:8000/health | grep -q "healthy" && curl -s http://localhost:8000/ready | grep -q "ready"; then
              echo "Services healthy and ready after ${i} attempts"
              break
            fi
            echo "Attempt ${i}/30 failed, sleeping 2s..."
            sleep 2
          done
          echo "Final check for /health:"
          curl -f -v http://localhost:8000/health
          echo "Final check for /ready:"
          curl -f -v http://localhost:8000/ready

      - name: Stop Docker compose services
        if: always()
        run: docker compose down
