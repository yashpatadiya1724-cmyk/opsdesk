# OpsDesk Alembic Configuration
# https://alembic.sqlalchemy.org/en/latest/tutorial.html

[alembic]
# Path to migration scripts
script_location = backend/alembic

# sys.path path, prepended to sys.path
prepend_sys_path = .

# Version locations: where revision scripts are stored
version_locations = backend/alembic/versions

# Version path separator
# Path separator for multi-platform compatibility
path_separator = os

# Default fallback sqlalchemy url (overridden dynamically in env.py via DATABASE_URL when empty)
sqlalchemy.url =

[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
